<svg width="480" height="230" viewBox="0 0 480 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      text { font-family: ui-monospace, 'Courier New', monospace; }
      .card { fill: #0d0b1e; stroke: #3f2d6b; }
      .row { opacity: 0; animation: slideIn 0.6s ease-out forwards; }
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-16px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      .ring {
        transform-origin: 90px 115px;
        animation: ringIn 1.6s ease-out forwards;
      }
      @keyframes ringIn {
        from { stroke-dashoffset: 345; }
        to   { stroke-dashoffset: 90; }
      }
      .label { fill: #a78bfa; }
      .value { fill: #f9a8d4; font-weight: 700; }
    </style>
  </defs>

  <rect x="1" y="1" width="478" height="228" rx="16" class="card"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#f0abfc">Teja Deep's GitHub Stats</text>

  <!-- rank ring -->
  <g>
    <circle cx="90" cy="115" r="55" fill="none" stroke="#241a44" stroke-width="10"/>
    <circle cx="90" cy="115" r="55" fill="none" stroke="url(#ringGrad)" stroke-width="10"
      stroke-linecap="round" stroke-dasharray="345" class="ring" transform="rotate(-90 90 115)"/>
    <text x="90" y="112" text-anchor="middle" font-size="26" font-weight="700" fill="#f0abfc">A</text>
    <text x="90" y="132" text-anchor="middle" font-size="10" fill="#a78bfa">RANK</text>
  </g>

  <!-- stat rows (edit these numbers as your profile grows) -->
  <g font-size="15" transform="translate(190,60)">
    <g class="row" style="animation-delay:0.2s"><text class="label" x="0" y="0">⭐ Total Stars Earned:</text><text class="value" x="240" y="0">1+</text></g>
    <g class="row" style="animation-delay:0.4s"><text class="label" x="0" y="34">📦 Total Commits:</text><text class="value" x="240" y="34">50+</text></g>
    <g class="row" style="animation-delay:0.6s"><text class="label" x="0" y="68">📁 Public Repos:</text><text class="value" x="240" y="68">3+</text></g>
    <g class="row" style="animation-delay:0.8s"><text class="label" x="0" y="102">👥 Followers:</text><text class="value" x="240" y="102">1+</text></g>
    <g class="row" style="animation-delay:1.0s"><text class="label" x="0" y="136">🔥 Contribution Streak:</text><text class="value" x="240" y="136">edit me</text></g>
  </g>
</svg>
