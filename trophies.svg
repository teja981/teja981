<svg width="1000" height="150" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: ui-monospace, 'Courier New', monospace; }
      .cell { fill: #0d0b1e; stroke: #3f2d6b; }
      .pop { opacity: 0; transform: scale(0.85); animation: pop 0.5s ease-out forwards; }
      @keyframes pop { to { opacity: 1; transform: scale(1); } }
      .shine { animation: sweep 3.5s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-140px); opacity:0; } 10% { opacity:0.5; } 40% { opacity:0; } 100% { transform: translateX(140px); opacity:0; } }
    </style>
    <linearGradient id="trophyShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 6 trophy cells: edit labels/ranks to match real achievements -->
  <g>
    <g class="pop" style="animation-delay:0.0s" transform="translate(10,10)">
      <rect width="150" height="130" rx="12" class="cell"/>
      <text x="120" y="26" text-anchor="end" font-size="16" font-weight="700" fill="#f9a8d4">S</text>
      <text x="16" y="60" font-size="26">🎓</text>
      <text x="16" y="90" font-size="12" fill="#e5e7eb">Builder</text>
      <text x="16" y="106" font-size="10" fill="#a78bfa">Repos 5+</text>
      <rect width="150" height="130" fill="url(#trophyShine)" clip-path="inset(0 round 12px)" class="shine"/>
    </g>
    <g class="pop" style="animation-delay:0.15s" transform="translate(172,10)">
      <rect width="150" height="130" rx="12" class="cell"/>
      <text x="120" y="26" text-anchor="end" font-size="16" font-weight="700" fill="#c084fc">A</text>
      <text x="16" y="60" font-size="26">💻</text>
      <text x="16" y="90" font-size="12" fill="#e5e7eb">Committer</text>
      <text x="16" y="106" font-size="10" fill="#a78bfa">Commits 50+</text>
      <rect width="150" height="130" fill="url(#trophyShine)" clip-path="inset(0 round 12px)" class="shine" style="animation-delay:0.5s"/>
    </g>
    <g class="pop" style="animation-delay:0.3s" transform="translate(334,10)">
      <rect width="150" height="130" rx="12" class="cell"/>
      <text x="120" y="26" text-anchor="end" font-size="16" font-weight="700" fill="#38bdf8">A</text>
      <text x="16" y="60" font-size="26">🧠</text>
      <text x="16" y="90" font-size="12" fill="#e5e7eb">ML Builder</text>
      <text x="16" y="106" font-size="10" fill="#a78bfa">CV + DL projects</text>
      <rect width="150" height="130" fill="url(#trophyShine)" clip-path="inset(0 round 12px)" class="shine" style="animation-delay:1s"/>
    </g>
    <g class="pop" style="animation-delay:0.45s" transform="translate(496,10)">
      <rect width="150" height="130" rx="12" class="cell"/>
      <text x="120" y="26" text-anchor="end" font-size="16" font-weight="700" fill="#4ade80">B</text>
      <text x="16" y="60" font-size="26">🕹️</text>
      <text x="16" y="90" font-size="12" fill="#e5e7eb">Real-Time Dev</text>
      <text x="16" y="106" font-size="10" fill="#a78bfa">WebSockets</text>
      <rect width="150" height="130" fill="url(#trophyShine)" clip-path="inset(0 round 12px)" class="shine" style="animation-delay:1.5s"/>
    </g>
    <g class="pop" style="animation-delay:0.6s" transform="translate(658,10)">
      <rect width="150" height="130" rx="12" class="cell"/>
      <text x="120" y="26" text-anchor="end" font-size="16" font-weight="700" fill="#fbbf24"/>
      <text x="16" y="60" font-size="26">✍️</text>
      <text x="16" y="90" font-size="12" fill="#e5e7eb">Storyteller</text>
      <text x="16" y="106" font-size="10" fill="#a78bfa">Screenwriter</text>
      <rect width="150" height="130" fill="url(#trophyShine)" clip-path="inset(0 round 12px)" class="shine" style="animation-delay:2s"/>
    </g>
    <g class="pop" style="animation-delay:0.75s" transform="translate(820,10)">
      <rect width="150" height="130" rx="12" class="cell"/>
      <text x="120" y="26" text-anchor="end" font-size="16" font-weight="700" fill="#f472b6">S</text>
      <text x="16" y="60" font-size="26">🚀</text>
      <text x="16" y="90" font-size="12" fill="#e5e7eb">Always Building</text>
      <text x="16" y="106" font-size="10" fill="#a78bfa">Still growing</text>
      <rect width="150" height="130" fill="url(#trophyShine)" clip-path="inset(0 round 12px)" class="shine" style="animation-delay:2.5s"/>
    </g>
  </g>
</svg>
